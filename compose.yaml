services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    ports:
      - "5672:5672"      
      - "15672:15672"    
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - backend
    healthcheck:          
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    volumes:
      - ./shared:/app/shared
      - ./gateway/db:/app/db   
    ports:
      - "8000:8000"
    depends_on:           
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  # dashboard:
