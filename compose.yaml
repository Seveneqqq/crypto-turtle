  #     - "5173:5173"
  #   depends_on:
  #     - rabbitmq
  #   networks:
  #     - backend

  data-module:
    build:
      context: ./data-module
      dockerfile: Dockerfile
    volumes:
      - ./shared:/app/shared
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

