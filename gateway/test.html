<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>OAuth Google – szybki test</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 14px; margin: 6px 6px 6px 0; cursor: pointer; }
    input[type="text"] { width: 100%; padding: 8px; }
    pre { background: #f6f8fa; padding: 12px; overflow: auto; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    small { color: #666; }
  </style>
</head>
<body>
  <h1>Test Google OAuth (Supabase + FastAPI)</h1>

  <div class="row">
    <button id="btn-login">Zaloguj z Google</button>
    <button id="btn-me">Who am I?</button>
    <button id="btn-logout">Wyczyść token</button>
  </div>

  <p><small>
    Tryby:<br>
    A) Cookie – backend ustawia cookie w callbacku → „Who am I?” zadziała bez tokena.<br>
    B) URL hash – backend po callbacku przekierowuje na <code>test.html#access_token=...</code> → token zapisze się sam.<br>
    C) Ręcznie – wklej token poniżej.
    </small>
  </p>

  <label for="token">Access token (opcjonalnie, jeśli nie używasz cookie):</label>
  <input id="token" type="text" placeholder="Bearer access token..." />
  <div class="row">
    <button id="btn-save-token">Zapisz token</button>
    <small id="status"></small>
  </div>

  <h3>Odpowiedź</h3>
  <pre id="out">—</pre>

  <script>
    // ==== KONFIG ====
    const API_BASE = "http://localhost:8000";
    const ENDPOINTS = {
      login: API_BASE + "/auth/login",
      me: API_BASE + "/auth/me"
    };
    const LS_KEY = "access_token";

    const $ = (id) => document.getElementById(id);
    const out = $("out");
    const statusEl = $("status");
    const tokenInput = $("token");

    // 1) Jeśli wróciliśmy tu po callbacku z #access_token=..., zapisz do localStorage
    (function captureTokenFromHash() {
      if (location.hash && location.hash.includes("access_token")) {
        const params = new URLSearchParams(location.hash.slice(1));
        const access = params.get("access_token");
        if (access) {
          localStorage.setItem(LS_KEY, access);
          tokenInput.value = access;
          statusEl.textContent = "Token przechwycony z URL i zapisany.";
          // Wyczyść hash, żeby nie zostawał w historii
          history.replaceState(null, "", location.pathname);
        }
      }
    })();

    // 2) Wczytaj token z localStorage na start
    (function loadToken() {
      const t = localStorage.getItem(LS_KEY);
      if (t) tokenInput.value = t;
    })();

    // 3) Handlery
    $("btn-login").onclick = () => {
      // pełne przekierowanie do /auth/login (backend zrobi redirect do Google)
      window.location.href = ENDPOINTS.login;
    };

    $("btn-save-token").onclick = () => {
      const t = tokenInput.value.trim();
      if (t) {
        localStorage.setItem(LS_KEY, t);
        statusEl.textContent = "Token zapisany w localStorage.";
      } else {
        localStorage.removeItem(LS_KEY);
        statusEl.textContent = "Token wyczyszczony.";
      }
    };

    $("btn-logout").onclick = () => {
      localStorage.removeItem(LS_KEY);
      tokenInput.value = "";
      statusEl.textContent = "Token wyczyszczony.";
      print("OK");
    };

    $("btn-me").onclick = async () => {
      print("Ładowanie…");
      try {
        const headers = {};
        const t = (tokenInput.value || "").trim();
        // Jeśli masz token (tryb B/C) – użyj Bearer; jeśli nie – spróbuj cookie (tryb A)
        if (t) headers["Authorization"] = "Bearer " + t;

        const res = await fetch(ENDPOINTS.me, {
          method: "GET",
          headers,
          // Jeśli używasz cookie-trybu z innej domeny, możesz dodać:
          credentials: "include",
        });

        const data = await res.json().catch(() => ({}));
        print(data, res.ok ? null : `HTTP ${res.status}`);
      } catch (e) {
        print({ error: String(e) });
      }
    };

    function print(msg, prefix = null) {
      out.textContent = (prefix ? prefix + "\n" : "") + (typeof msg === "string" ? msg : JSON.stringify(msg, null, 2));
    }
  </script>
</body>
</html>
